name: Check WordPress Version and Tag

on:
  schedule:
    - cron: '0 0 * * *' # Runs this task daily at midnight
  workflow_dispatch: # Allows manually triggering

jobs:
  check-version-and-tag:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Tag the newest version of each supported series
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        STATUS=$(curl -fsS https://api.wordpress.org/core/stable-check/1.0/)
        LATEST=$(echo "$STATUS" | jq -r 'to_entries[] | select(.value == "latest") | .key')
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        for VERSION in $(echo "$STATUS" | jq -r 'keys[]' | sh .github/scripts/tags.sh series); do
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "$VERSION is already tagged."
            continue
          fi
          echo "Creating new tag for $VERSION"
          git tag "$VERSION"
          git push origin "$VERSION"
          GH_TOKEN=$GITHUB_TOKEN gh release create "$VERSION" --title "$VERSION" --generate-notes "--latest=$([ "$VERSION" = "$LATEST" ] && echo true || echo false)"
          curl -fsS -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GH_PAT" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches \
            -d '{"ref":"refs/tags/'"$VERSION"'"}'
        done
