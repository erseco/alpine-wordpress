name: Build

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to (re)build with the current Dockerfile, e.g. 6.9.4 (empty builds latest)'
        required: false

jobs:
  buildx:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code (with all tags, used to compute the series aliases)
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Step 1.5: Test the tag helper
      - name: Test tag helper
        run: sh .github/scripts/tags_test.sh

      # Step 2: Prepare variables for building and tagging the image
      - name: Prepare
        id: prepare
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY}
          DOCKER_PLATFORMS=linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/386,linux/ppc64le,linux/s390x

          # Determine VERSION from the pushed tag or the manual input
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=$(echo "${GITHUB_REF#refs/tags/}" | sed 's/\//-/g') # Extract tag name and replace / with -
          else
            VERSION=$INPUT_VERSION
          fi

          if [[ -z $VERSION ]]; then
            WP_VERSION="latest"
            ALIASES="latest"
          elif [[ $VERSION =~ ^[0-9]+(\.[0-9]+)*(-[0-9]+)?$ ]]; then
            WP_VERSION=$(echo "$VERSION" | cut -d'-' -f1) # Extract main version part for WordPress
            # Also tag <minor>, <major> and latest when this is the newest version of that series
            ALIASES=$(git tag | sh .github/scripts/tags.sh aliases "$VERSION")
          else
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          TAGS=$(for a in $ALIASES; do printf '%s,' "${GITHUB_REPOSITORY}:$a"; done)
          GHCR_TAGS=$(for a in $ALIASES; do printf '%s,' "${GHCR_IMAGE}:$a"; done)
          echo "Tags: $ALIASES"

          echo "platforms=${DOCKER_PLATFORMS}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS%,}" >> $GITHUB_OUTPUT
          echo "ghcr-tags=${GHCR_TAGS%,}" >> $GITHUB_OUTPUT
          echo "wp-version=${WP_VERSION}" >> $GITHUB_OUTPUT
          echo "php-base=$(sh .github/scripts/tags.sh base "$WP_VERSION")" >> $GITHUB_OUTPUT

      # Step 3: Set up QEMU for multi-platform builds
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      # Step 4: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: buildx

      # Step 5: Login to DockerHub
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 5.5: Login to GitHub Container Registry
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Step 6: Debug Build
      - name: Debug Build on PR
        run: |
          docker buildx build --load .

      # Step 7: Test the built image
      - name: Test
        run: |
          docker compose version
          docker compose --file docker-compose.test.yml up --exit-code-from sut --timeout 10 --build

      # Step 8: Build and Push (if not a PR)
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.prepare.outputs.tags }}
          platforms: ${{ steps.prepare.outputs.platforms }}
          build-args: |
            WORDPRESS_VERSION=${{ steps.prepare.outputs.wp-version }}
            PHP_BASE=${{ steps.prepare.outputs.php-base }}

      # Step 9: Push to GitHub Container Registry
      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.prepare.outputs.ghcr-tags }}
          platforms: ${{ steps.prepare.outputs.platforms }}
          build-args: |
            WORDPRESS_VERSION=${{ steps.prepare.outputs.wp-version }}
            PHP_BASE=${{ steps.prepare.outputs.php-base }}

      # Step 10: Update Docker Hub Description
      - name: Generate Docker Hub README with the tag list
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        run: |
          { sed '/<!-- tags:start -->/q' README.md
            git tag | sh .github/scripts/tags.sh readme
            sed -n '/<!-- tags:end -->/,$p' README.md
          } > dockerhub-README.md

      - name: Docker Hub Description
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          readme-filepath: ./dockerhub-README.md
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          short-description: ${{ github.event.repository.description }}
